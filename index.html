<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05030f">
<title>نبرد امپراتوری‌ها</title>
<style>
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#05060f;overscroll-behavior:none;touch-action:none;font-family:Tahoma,"Segoe UI",system-ui,sans-serif;color:#e5e7eb}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit}

/* شیشه‌ی تیره (بدون blur برای جلوگیری از لگ موبایل) */
.dg{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,0) 45%),rgba(14,18,38,.8);border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 8px 22px rgba(0,0,0,.5);color:#e5e7eb}
.btn{position:relative;border:1px solid rgba(255,255,255,.28);background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.06)),rgba(20,26,52,.85);border-radius:14px;color:#fff;font-weight:800;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 5px 12px rgba(0,0,0,.45);transition:transform .15s}
.btn:active{transform:scale(.92)}
.sel{border-color:#a78bfa!important;box-shadow:0 0 0 1px #a78bfa,0 0 22px rgba(167,139,250,.65)!important}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;transition:opacity .4s}
#hud.off{opacity:0;visibility:hidden}
#hud>*{position:absolute;pointer-events:auto}
#topL{top:calc(var(--sat) + 10px);left:10px;display:flex;flex-direction:column;gap:6px}
#topL .btn{width:40px;height:40px;font-size:18px}
#counter{top:calc(var(--sat) + 8px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:2px 14px;border-radius:999px;pointer-events:none}
#num{font-family:"Arial Rounded MT Bold",Arial,system-ui,sans-serif;font-weight:900;font-size:44px;line-height:1;color:#fff;-webkit-text-stroke:7px #0b1020;paint-order:stroke fill;text-shadow:0 3px 0 #0b1020;transition:transform .25s cubic-bezier(.34,1.56,.64,1);direction:ltr}
#num.bump{transform:scale(1.25)}
#info{font-size:11px;font-weight:800;color:#fff;line-height:1.5;text-align:center}
#info b{display:block;background:rgba(255,255,255,.16);border-radius:999px;padding:0 8px}
#lb{top:calc(var(--sat) + 10px);right:10px;width:118px;border-radius:18px;padding:6px;font-size:11px;pointer-events:none}
#lb .row{display:flex;align-items:center;gap:4px;padding:3px 4px;border-radius:10px;font-weight:800;color:#fff}
#lb .row.me{background:rgba(255,255,255,.22)}
#lb i{width:12px;height:12px;border-radius:4px;border:1px solid rgba(0,0,0,.5);flex:none}
#lb span{margin-right:auto}
#toast{top:calc(var(--sat) + 62px);left:50%;transform:translate(-50%,6px);opacity:0;transition:.3s;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;pointer-events:none;color:#fff}
#toast.show{opacity:1;transform:translate(-50%,0)}
#hint{bottom:calc(var(--sab) + 126px);left:50%;transform:translateX(-50%);padding:6px 14px;border-radius:999px;font-size:12px;font-weight:800;color:#fff;white-space:nowrap;transition:opacity .5s;pointer-events:none}
#skills{bottom:calc(var(--sab) + 10px);left:50%;transform:translateX(-50%);display:grid;grid-template-columns:repeat(4,72px);gap:5px}
@media (orientation:landscape){#skills{grid-template-columns:repeat(8,60px)}.skill{width:60px!important}}
.skill{width:72px;height:50px;font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;overflow:hidden;border-radius:13px}
.skill em{font-style:normal;font-size:21px;line-height:1}
.skill .cdo{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(0,0,0,.6)}
.skill .cdt{position:absolute;top:3px;font-size:14px;color:#fff;font-weight:900;text-shadow:0 1px 3px #000}
#topL #spdBtn{font-size:12px}

/* ---------- MENU ---------- */
#menu{position:fixed;inset:0;z-index:10;background:radial-gradient(ellipse at 50% 0%,rgba(40,24,90,.92),rgba(3,4,10,.97) 72%);transition:opacity .5s,visibility .5s;touch-action:pan-y}
#menu.off{opacity:0;visibility:hidden;pointer-events:none}
#menu.off *{animation:none!important}
.a{position:absolute;border-radius:50%;opacity:.5}
.a1{width:340px;height:340px;background:radial-gradient(circle,#7c3aed,transparent 68%);top:-8%;left:-22%}
.a2{width:360px;height:360px;background:radial-gradient(circle,#06b6d4,transparent 68%);bottom:0;right:-26%}
.a3{width:300px;height:300px;background:radial-gradient(circle,#db2777,transparent 68%);top:46%;left:15%;opacity:.3}
#stars span{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.1}50%{opacity:.9}}
#mwrap{position:relative;height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;padding-top:calc(var(--sat) + 8px)}
#mtop{display:flex;align-items:center;justify-content:space-between;padding:0 14px 6px}
#brand{font-size:13px;font-weight:900;color:#c4b5fd;letter-spacing:.5px}
#mtop .right{display:flex;gap:8px;align-items:center}
#coins{padding:6px 14px;border-radius:999px;font-weight:900;font-size:14px;color:#fde68a}
#mSnd{width:36px;height:36px;font-size:16px}
#mbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:4px 14px 12px}
.tab{display:none;animation:fade .35s}
.tab.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(12px)}}
#logo{width:76px;height:76px;margin:6px auto 6px;border-radius:26px;display:flex;align-items:center;justify-content:center;font-size:44px;background:linear-gradient(135deg,rgba(251,191,36,.9),rgba(245,158,11,.6));border:1px solid rgba(255,255,255,.6);box-shadow:0 0 34px rgba(251,191,36,.55),inset 0 2px 2px rgba(255,255,255,.7);animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-7px) rotate(-4deg)}}
#ttl{text-align:center;font-size:28px;font-weight:900;background:linear-gradient(90deg,#67e8f9,#c084fc,#f472b6,#67e8f9);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 5s linear infinite}
@keyframes shim{to{background-position:250% 0}}
#sub{text-align:center;font-size:12px;font-weight:700;color:#94a3b8;margin:2px 0 12px}
.lbl{font-size:12px;font-weight:800;color:#cbd5e1;margin:10px 2px 6px}
#modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode{border-radius:18px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;gap:2px;align-items:center}
.mode em{font-style:normal;font-size:26px}
.mode b{font-size:13px;color:#fff}
.mode small{font-size:10px;color:#94a3b8;font-weight:700}
#sw{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
#sw button{aspect-ratio:1;border-radius:9px;border:2px solid rgba(255,255,255,.7);box-shadow:0 2px 6px rgba(0,0,0,.5);transition:transform .15s}
#sw button.sel{transform:scale(1.2)}
#playBar{padding:8px 14px 8px}
#play{width:100%;padding:15px 0;border-radius:20px;border:1px solid rgba(255,255,255,.7);font-size:20px;font-weight:900;color:#fff;background:linear-gradient(180deg,#fbbf24,#ea580c);text-shadow:0 2px 3px rgba(120,53,15,.7);box-shadow:inset 0 2px 2px rgba(255,255,255,.6),0 0 30px rgba(249,115,22,.6);position:relative;overflow:hidden}
#play:active{transform:scale(.96)}
#how{font-size:11px;font-weight:700;color:#64748b;margin-top:10px;line-height:1.8;text-align:center}
#mnav{display:flex;margin:0 10px calc(var(--sab) + 10px);border-radius:22px;padding:5px;gap:4px}
#mnav button{flex:1;position:relative;border:0;border-radius:17px;background:transparent;color:#94a3b8;font-size:20px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:1px;transition:.2s}
#mnav button span{font-size:11px;font-weight:800}
#mnav button.on{background:linear-gradient(135deg,rgba(124,58,237,.7),rgba(6,182,212,.5));color:#fff;box-shadow:0 0 18px rgba(124,58,237,.55)}
#qdot{position:absolute;top:4px;right:28%;width:9px;height:9px;border-radius:50%;background:#f43f5e;display:none;box-shadow:0 0 8px #f43f5e}
#mt{position:fixed;left:50%;top:calc(var(--sat) + 60px);transform:translate(-50%,-10px);opacity:0;transition:.3s;z-index:30;padding:8px 16px;border-radius:999px;font-size:13px;font-weight:800;color:#fff;pointer-events:none;white-space:nowrap}
#mt.show{opacity:1;transform:translate(-50%,0)}

/* تسک‌ها */
.qc{border-radius:18px;padding:12px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.qt{font-size:13px;font-weight:800;color:#fff}
.bar{grid-column:1;height:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#22d3ee,#a78bfa)}
.qc small{font-size:10px;color:#94a3b8;font-weight:700;grid-column:1}
.claim{grid-column:2;grid-row:1/4;padding:10px 12px;font-size:13px;min-width:74px}
.claim:disabled{opacity:.4}
.claim.go{background:linear-gradient(180deg,#fbbf24,#ea580c);border-color:#fff}

/* فروشگاه */
#cats{display:flex;gap:6px;margin-bottom:10px}
#cats .btn{flex:1;padding:9px 0;font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{border-radius:20px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px}
.item canvas{width:72px;height:72px}
.item b{font-size:13px;color:#fff}
.item small{font-size:10px;color:#94a3b8;font-weight:700;min-height:26px}
.buy{width:100%;padding:8px 0;font-size:12px;margin-top:2px}
.buy.price{background:linear-gradient(180deg,#fbbf24,#ea580c);border-color:#fff}

/* پایان بازی */
#end{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(3,4,10,.82)}
#end.show{display:flex}
#end .dg{width:90%;max-width:360px;border-radius:28px;padding:20px;text-align:center;animation:fade .5s both}
#eBadge{width:76px;height:76px;margin:0 auto 8px;border-radius:24px;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:42px;box-shadow:0 0 30px rgba(255,255,255,.35)}
#end h2{font-size:22px;font-weight:900;color:#fff}
#end p{font-size:12px;font-weight:700;color:#94a3b8;margin:4px 0 10px}
#stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:rgba(255,255,255,.08);border-radius:16px;padding:10px 4px;margin-bottom:10px;font-size:11px;font-weight:800;color:#94a3b8}
#stats b{display:block;font-size:17px;color:#fff}
#eRew{font-size:18px;font-weight:900;color:#fde68a;margin-bottom:6px}
#end .btn{width:100%;padding:12px 0;font-size:14px;margin-top:6px}
#end .btn.main{background:linear-gradient(135deg,rgba(124,58,237,.9),rgba(6,182,212,.7))}
/* کراون هورد */
#hh{position:fixed;inset:0;pointer-events:none;z-index:5}
#hh.off{display:none}
#hh>*{position:absolute;pointer-events:auto}
#hL1{top:calc(var(--sat) + 10px);left:10px;display:flex;flex-direction:column;gap:6px}
#hL1 .btn{width:40px;height:40px;font-size:18px}
#hCnt{top:calc(var(--sat) + 10px);left:58px;padding:4px 14px;border-radius:14px;text-align:center;pointer-events:none}
#hN{font-size:30px;font-weight:900;color:#fff;line-height:1.1;direction:ltr}
#hK{font-size:11px;font-weight:800;color:#fde68a}
#hTm{top:calc(var(--sat) + 10px);right:10px;padding:6px 14px;border-radius:12px;font-size:18px;font-weight:900;color:#fff;pointer-events:none}
#hLb{top:calc(var(--sat) + 54px);right:10px;width:150px;border-radius:14px;padding:5px;font-size:11px;pointer-events:none}
#hLb .row{display:flex;align-items:center;gap:4px;padding:3px 4px;border-radius:9px;font-weight:800;color:#fff}
#hLb .row.me{background:rgba(255,255,255,.22)}
#hLb i{width:11px;height:11px;border-radius:3px;border:1px solid rgba(0,0,0,.5);flex:none}
#hLb em{font-style:normal;font-size:10px;max-width:62px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hLb span{margin-right:auto}
#hTo{top:calc(var(--sat) + 120px);left:50%;transform:translate(-50%,6px);opacity:0;transition:.3s;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;pointer-events:none;color:#fff}
#hTo.show{opacity:1;transform:translate(-50%,0)}
#hCry{right:14px;bottom:calc(var(--sab) + 22px);width:78px;height:78px;border-radius:50%;background:radial-gradient(#ef4444,#7f1d1d);border:3px solid #fbbf24;overflow:hidden;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center}
#hCry em,#hForm em{font-style:normal;font-size:24px;line-height:1}
#hCry .cdo{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(0,0,0,.6)}
#hCry .cdt{position:absolute;top:8px;font-size:18px;color:#fff;font-weight:900}
#hForm{right:102px;bottom:calc(var(--sab) + 28px);width:64px;height:64px;border-radius:50%;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid #fbbf24}
/* ===== شیشه‌ی کامل (Liquid Glass) ===== */
.dg,.btn,#mnav,#coins{-webkit-backdrop-filter:blur(16px) saturate(1.7);backdrop-filter:blur(16px) saturate(1.7)}
.dg{background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,.03) 38%,rgba(124,92,255,.12) 100%),rgba(26,12,60,.40);border:1px solid rgba(255,255,255,.24);border-top-color:rgba(255,255,255,.5);border-left-color:rgba(255,255,255,.34);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(255,255,255,.08),inset 0 0 24px rgba(167,139,250,.14),0 12px 32px rgba(6,2,24,.55)}
.btn{background:linear-gradient(160deg,rgba(255,255,255,.26),rgba(255,255,255,.05) 55%,rgba(99,102,241,.16)),rgba(30,16,70,.38);border:1px solid rgba(255,255,255,.3);border-top-color:rgba(255,255,255,.55);border-radius:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 0 16px rgba(167,139,250,.15),0 8px 20px rgba(6,2,24,.5)}
#topL .btn,#hL1 .btn{border-radius:16px}
#menu{background:radial-gradient(ellipse 90% 55% at 15% 0%,rgba(139,92,246,.8),transparent 62%),radial-gradient(ellipse 80% 55% at 95% 90%,rgba(37,99,235,.65),transparent 62%),radial-gradient(ellipse 70% 45% at 0% 100%,rgba(91,33,182,.55),transparent 60%),#05030f}
.a1{background:radial-gradient(circle,#8b5cf6,transparent 68%)}.a2{background:radial-gradient(circle,#2563eb,transparent 68%)}.a3{background:radial-gradient(circle,#6d28d9,transparent 68%);opacity:.35}
#logo{background:linear-gradient(135deg,rgba(255,255,255,.3),rgba(139,92,246,.35) 55%,rgba(59,130,246,.4));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 10px 30px rgba(99,60,255,.45)}
.mode,.item,.qc{border-radius:26px}#mnav{border-radius:30px}#end .dg{border-radius:32px}
#end{background:radial-gradient(ellipse at 50% 20%,rgba(76,29,149,.55),rgba(3,2,12,.88));-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#play{background:linear-gradient(160deg,rgba(255,255,255,.34),rgba(255,255,255,.06) 50%,rgba(99,102,241,.35)),rgba(79,53,190,.5);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.5);border-top-color:rgba(255,255,255,.75);text-shadow:0 2px 8px rgba(30,10,90,.8);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 0 26px rgba(167,139,250,.3),0 10px 34px rgba(99,60,255,.55)}
.buy.price,.claim.go,#end .btn.main{background:linear-gradient(160deg,rgba(255,255,255,.32),rgba(255,255,255,.05) 50%,rgba(99,102,241,.4)),rgba(79,53,190,.55);border-color:rgba(255,255,255,.6)}
#mnav button.on{background:linear-gradient(160deg,rgba(255,255,255,.28),rgba(139,92,246,.4),rgba(59,130,246,.3));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 0 20px rgba(139,92,246,.5)}
#mt{-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
/* ===== کهکشان + فروشگاه ===== */
#gx{position:absolute;inset:0;width:100%;height:100%;z-index:0}
#stars,.a{display:none}#mwrap{z-index:2}
#brand{letter-spacing:3px;text-shadow:0 0 12px rgba(167,139,250,.9)}
#logo{position:relative;width:84px;height:84px;margin:14px auto 22px;animation:bob 4s ease-in-out infinite,glo 3s ease-in-out infinite}
#logo::before{content:'';position:absolute;inset:-12px -30px;border:2px solid rgba(196,181,253,.55);border-radius:50%;transform:rotate(-20deg) scaleY(.3);box-shadow:0 0 16px rgba(139,92,246,.7),inset 0 0 12px rgba(139,92,246,.4)}
@keyframes glo{50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 10px 50px rgba(139,92,246,.95)}}
#ttl{font-size:33px;filter:drop-shadow(0 0 14px rgba(167,139,250,.75))}
#sub{color:#c4b5fd;margin-bottom:12px}
#chips{display:flex;gap:8px;justify-content:center;margin:0 0 14px}#chips span{padding:6px 12px;border-radius:999px;font-size:11px;font-weight:800;color:#cbd5e1}#chips b{color:#fff;font-size:13px}
#modes{grid-template-columns:1fr}.mode{flex-direction:row;justify-content:flex-start;gap:14px;padding:16px 18px;text-align:right;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 0 34px rgba(139,92,246,.45),0 12px 32px rgba(6,2,24,.55)}
.mode em{font-size:44px;filter:drop-shadow(0 0 12px rgba(251,191,36,.7))}.mode div{display:flex;flex-direction:column;align-items:flex-start;gap:3px}.mode b{font-size:17px}.mode small{font-size:11px;color:#c4b5fd}
#play{position:relative;overflow:hidden}#play::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:swp 3.2s infinite}@keyframes swp{to{left:140%}}
#how{color:#a5b4fc}
#shopHd{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-radius:24px;margin-bottom:10px}
#shopHd b{font-size:16px;color:#fff;display:block}#shopHd small{font-size:11px;color:#a5b4fc;font-weight:700}
#shopHd .bal{font-size:18px;font-weight:900;color:#fde68a;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 0 16px rgba(251,191,36,.25)}
#cats{padding:4px;border-radius:22px;gap:4px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18)}
#cats .btn{border-radius:18px;background:transparent;border-color:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;color:#c4b5fd}
#cats .btn.sel{background:linear-gradient(160deg,rgba(255,255,255,.3),rgba(139,92,246,.5),rgba(59,130,246,.4))!important;color:#fff;border-color:rgba(255,255,255,.4)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 0 18px rgba(139,92,246,.55)!important}
.item{position:relative;overflow:hidden;border-color:color-mix(in srgb,var(--rc) 55%,transparent)}
.item::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 32%,color-mix(in srgb,var(--rc) 38%,transparent),transparent 62%);pointer-events:none}
.stage{position:relative;width:100%;display:flex;justify-content:center;padding:14px 0 2px}
.stage::after{content:'';position:absolute;bottom:0;width:64px;height:12px;border-radius:50%;background:radial-gradient(ellipse,var(--rc),transparent 70%);opacity:.8}
.item canvas{position:relative;z-index:1;animation:flt 3s ease-in-out infinite;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
@keyframes flt{50%{transform:translateY(-5px)}}
.rar{position:absolute;top:8px;right:8px;font-style:normal;font-size:9.5px;font-weight:900;color:var(--rc);padding:2px 8px;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid var(--rc);z-index:2}

 init(){

function addNode(type,gx,gy){nodes.push({type,gx,gy,owner:0,cd:2+Math.random()*2,pulse:Math.random()*TAU})}
function wallBracket(cx,cy,openAng){
  const dir=Math.round((((openAng%TAU)+TAU)%TAU)/(Math.PI/2))%4;
  for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){
    if(Math.abs(dx)!==2&&Math.abs(dy)!==2)continue;
    if(dir===0&&dx===2&&Math.abs(dy)<=1)continue;
    if(dir===1&&dy===2&&Math.abs(dx)<=1)continue;
    if(dir===2&&dx===-2&&Math.abs(dy)<=1)continue;
    if(dir===3&&dy===-2&&Math.abs(dx)<=1)continue;
    const x=cx+dx,y=cy+dy;if(inB(x,y))grid[y*GRID+x]=WALL;
  }
}

  for(let i=0;i<8;i++){const a=i/8*TAU+TAU/16,gx=Math.round(C+Math.cos(a)*or),gy=Math.round(C+Math.sin(a)*or);addNode(i%2?'laser':'sword',gx,gy);wallBracket(gx,gy,a+Math.PI)}

  {const M=11,E=GRID-1-M;pos.push([M,M],[E,M],[E,E],[M,E])} // ۴ گوشه‌ی نقشه

      cx:p[0],cy:p[1],alive:true,hp:160,maxHp:160,terr:25,uc:0,crowns:0,sword:1,shield:0,
      spT:Math.random(),exT:Math.random()*.4,tgT:Math.random()*2,rx:null,ry:null,boost:0,rage:0,arT:Math.random(),target:null,lastHit:-9,cap:0,skin,swd,
      hpM:isMe?perk(SKINS,skin,'hp'):1,spdM:isMe?perk(SKINS,skin,'spd'):1,dmgM:isMe?perk(SKINS,skin,'dmg')*perk(SWORDS,swd,'dmg'):1,spM:isMe?perk(SKINS,skin,'sp'):1};
    F.push(f);

  });
  if(m==='zombie'){
    ZF={id:n+1,z:true,name:'زامبی‌ها',color:'#7cb342',fill:pack(124,179,66),fill2:pack(114,166,58),dark:pack(36,60,20),cx:C,cy:C,alive:true,hp:1e9,maxHp:1e9,terr:0,uc:0,crowns:0,sword:1,shield:0,spT:3,exT:0,tgT:0,rx:null,ry:null,boost:0,rage:0,arT:0,target:null,lastHit:-9,cap:0,skin:'zombie',swd:'basic',hpM:1,spdM:1,dmgM:1,spM:1};

/* ================= منطق بازی ================= */
function spawnUnit(f,x,y,elite){
  if(!f||!f.alive)return;
  const a=Math.random()*TAU;
  const base=f.z?14+Math.min(22,t/12):(elite?48:24+f.shield*10),hp=Math.round(base*f.hpM);
  const u={f:f.id,x,y,vx:Math.cos(a)*7,vy:Math.sin(a)*7,hp,maxHp:hp,ang:Math.random()*TAU,face:0,walk:Math.random()*6,
    spin:(Math.random()<.5?1:-1)*(5.5+Math.random()*1.5),elite:!!elite,rt:Math.random()*.5,tx:GRID/2,ty:GRID/2,dead:0,frz:0,fl:0};
  units.push(u);return u;
}
function setCell(x,y,id){if(!inB(x,y))return;const k=y*GRID+x;if(grid[k]===WALL||mask[k])return;grid[k]=id}
function paint(gx,gy,r,id){const cx=Math.round(gx),cy=Math.round(gy);for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++)setCell(cx+dx,cy+dy,id)}
function fireBar(f,sx,sy,tx,ty){
  const a=Math.atan2(ty-sy,tx-sx);
  bars.push({f:f.id,x:sx,y:sy,vx:Math.cos(a)*30,vy:Math.sin(a)*30,ang:a,life:1.5,hit:{}});
  sfx.laser();
}
function wave(x,y,max,color,alpha){if(waves.length<60)waves.push({x,y,r:.6,max,color,a:alpha||.8})}
function burst(x,y,color,n,sz){
  for(let i=0;i<n&&parts.length<260;i++){const a=Math.random()*TAU,s=4+Math.random()*14;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,color,size:sz||(1+Math.random()*1.2),life:(sz?.25:.5)+Math.random()*.35})}
}
function conquer(v,c){
  if(!v.alive||v.id===c.id)return;
  v.alive=false;
  for(let i=0;i<grid.length;i++)if(grid[i]===v.id)grid[i]=c.id;
  for(const u of units)if(u.f===v.id){u.hp=0;burst(u.x,u.y,v.color,4)}
  for(const n of nodes)if(n.owner===v.id)n.owner=c.id;
  c.cap++;if(c.id===me)capsM++;
  wave(v.cx,v.cy,16,c.color,.9);burst(v.cx,v.cy,c.color,32);
  shake=(c.id===me||v.id===me)?9:4;
  sfx.conquer();
  if(playing&&(c.id===me||v.id===me)&&navigator.vibrate)navigator.vibrate(60);
  toast(`قلعه «${v.name}» توسط «${c.name}» فتح شد!`,c.color);
}
function countTerr(){for(const f of F)f.terr=0;for(let i=0;i<grid.length;i++){const c=grid[i];if(c>0&&F[c-1])F[c-1].terr++}}
function nearestFoe(f,x,y){
  let best=null,bd=1e9;

    if(f.z)return null;
    for(const u of units)if(F[u.f-1].z){const d=Math.hypot(u.x-x,u.y-y);if(d<bd){bd=d;best={x:u.x,y:u.y}}}
    return best;
  }
  for(const e of F)if(e.alive&&!e.z&&e.id!==f.id){const d=Math.hypot(e.cx-x,e.cy-y);if(d<bd){bd=d;best={x:e.cx,y:e.cy}}}
  return best;
}
function aiPick(f){
  if(mode==='zombie'){
    const z=nearestFoe(f,f.cx,f.cy);if(z){f.target=z;return}
  }
  let best=null,bs=1e9;const aggr=Math.max(.35,1-t/180);
  for(const n of nodes)if(n.owner!==f.id){
    const d=Math.hypot(n.gx-f.cx,n.gy-f.cy)*(n.type==='crown'?.6:.85);
    if(d<bs){bs=d;best={x:n.gx,y:n.gy}}
  }
  if(mode!=='zombie')for(const e of F)if(e.alive&&!e.z&&e.id!==f.id){
    const d=Math.hypot(e.cx-f.cx,e.cy-f.cy)*aggr*(e.hp<e.maxHp*.6?.6:1)*(F.length<=2?.3:1);
    if(d<bs){bs=d;best={x:e.cx,y:e.cy}}
  }

}
function expand(f){
  const R=14+Math.min(20,f.terr/40)|0;
  for(let k=0;k<12;k++){
    const rx=f.cx+Math.round((Math.random()-.5)*2*R),ry=f.cy+Math.round((Math.random()-.5)*2*R);
    if(!inB(rx,ry)||grid[ry*GRID+rx]!==f.id)continue;
    const d=[[1,0],[-1,0],[0,1],[0,-1]][Math.random()*4|0],nx=rx+d[0],ny=ry+d[1];
    if(!inB(nx,ny))continue;const c=grid[ny*GRID+nx];
    if(c===0||(c>0&&c!==f.id&&Math.random()<.2&&isFoe(f.id,c))){setCell(nx,ny,f.id);return}
  }
}

/* ================= شبیه‌سازی ================= */
const BK=GRID/4,buckets=Array.from({length:BK*BK},()=>[]),NB=[[1,0],[0,1],[1,1],[-1,1]];
function hit(a,b){
  if(a.f===b.f||!isFoe(a.f,b.f))return;
  const dx=b.x-a.x,dy=b.y-a.y;if(Math.abs(dx)>5||Math.abs(dy)>5)return;
  const d=Math.hypot(dx,dy),f1=F[a.f-1],f2=F[b.f-1];
  if(d>=3.2+Math.max(f1.sword,f2.sword)*.32)return;
  const s1=(8+f1.sword*4)*f1.dmgM*(f1.rage>0?1.35:1),s2=(8+f2.sword*4)*f2.dmgM*(f2.rage>0?1.35:1);
  b.hp-=(f2.shield>0||b.elite)?s1*.65:s1;a.hp-=(f1.shield>0||a.elite)?s2*.65:s2;
  if(b.hp<=0&&!b.dead){b.dead=1;if(a.f===me)kills++}
  if(a.hp<=0&&!a.dead){a.dead=1;if(b.f===me)kills++}
  const nx=dx/(d||1),ny=dy/(d||1);
  a.vx=-nx*9;a.vy=-ny*9;b.vx=nx*9;b.vy=ny*9;a.spin=-a.spin;b.spin=-b.spin;a.fl=b.fl=.12;
  const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
  if(Math.random()<.4)burst(mx,my,'#fde047',3,.35);
  if(waves.length<40&&Math.random()<.22)waves.push({x:mx,y:my,r:.4,max:3,color:'#ffffff',a:.55});
  sfx.clash();
}
function collectDrop(d,f){
  const col=f.color;let msg;
  wave(d.x,d.y,9,'#ffffff',.9);burst(d.x,d.y,'#ffffff',22);
  if(d.type==='army'){for(let i=0;i<8;i++)spawnUnit(f,d.x+(Math.random()-.5)*3,d.y+(Math.random()-.5)*3,true);msg='📦 +۸ سرباز نخبه'}
  else if(d.type==='rage'){f.rage=6;msg='📦 هجوم ۶ ثانیه‌ای!'}
  else if(d.type==='heal'){for(const u of units)if(u.f===f.id)u.hp=u.maxHp;f.hp=Math.min(f.maxHp,f.hp+40);msg='📦 درمان کامل لشکر'}
  else{f.boost=8;msg='📦 شمشیر تقویت‌شده ۸ ثانیه'}
  if(f.id===me){sfx.coin();toast(msg,col);shake=Math.max(shake,4);S.st.drops=(S.st.drops||0)+1}
}
function updateDrops(dt){
  dropT-=dt;
  if(dropT<=0&&drops.length<2){
    dropT=13+Math.random()*7;let x,y,k=0;
    do{x=3+Math.random()*(GRID-6);y=3+Math.random()*(GRID-6);k++}while(k<30&&(grid[(y|0)*GRID+(x|0)]===WALL||mask[(y|0)*GRID+(x|0)]));
    drops.push({x,y,t:0,type:['army','rage','heal','boost'][Math.random()*4|0]});
    wave(x,y,7,'#ffffff',.8);toast('📦 جعبه امداد فرود آمد! لشکرت رو بفرست سمتش','#e2e8f0');
  }
  for(let i=drops.length-1;i>=0;i--){
    const d=drops[i];d.t+=dt;if(d.t<1)continue;
    let who=null;
    for(const u of units){const uf=F[u.f-1];if(uf&&!uf.z&&uf.alive&&!u.dead&&Math.abs(u.x-d.x)<2.4&&Math.abs(u.y-d.y)<2.4){who=uf;break}}
    if(who){collectDrop(d,who);drops.splice(i,1)}else if(d.t>45)drops.splice(i,1);
  }
}
function step(dt){
  t+=dt;updateDrops(dt);
  for(const k in cd)if(cd[k]>0)cd[k]=Math.max(0,cd[k]-dt);
  if(++stepN%10===0)countTerr();
  for(const f of F){f.crowns=0;f.sword=1+(f.boost>0?2:0);f.shield=0;f.uc=0;if(f.boost>0)f.boost-=dt;if(f.rage>0)f.rage-=dt}
  for(const u of units){const f=F[u.f-1];if(f&&f.alive&&!u.guard)f.uc++}

  for(const n of nodes){
    n.pulse+=dt*4;
    const o=grid[n.gy*GRID+n.gx];
    if(o>0&&o!==n.owner){n.owner=o;wave(n.gx,n.gy,6,F[o-1].color,.75)}
    if(n.owner>0){
      const f=F[n.owner-1];if(!f.alive){n.owner=0;continue}
      if(n.type==='crown')f.crowns++;else if(n.type==='sword')f.sword++;else if(n.type==='shield')f.shield++;
      else if(!f.z){n.cd-=dt;if(n.cd<=0){n.cd=3.4;const tg=nearestFoe(f,n.gx,n.gy);if(tg)fireBar(f,n.gx,n.gy,tg.x,tg.y)}}
    }
  }

  // تیراندازی قلعه‌ها
  for(const f of F){
    if(!f.alive||f.z)continue;
    f.arT-=dt;if(f.arT>0)continue;f.arT=1.1;
    let b=null,bd=100;
    for(const u of units){if(!isFoe(f.id,u.f))continue;const d=(u.x-f.cx)*(u.x-f.cx)+(u.y-f.cy)*(u.y-f.cy);if(d<bd){bd=d;b=u}}
    if(b){b.hp-=16;b.fl=.12;shots.push({x1:f.cx,y1:f.cy,x2:b.x,y2:b.y,life:.14,c:f.color});sfx.bow()}
  }

  // موج زامبی‌ها
  if(ZF){
    ZF.spT-=dt;
    if(ZF.spT<=0){
      ZF.spT=Math.max(2.2,6-t/20);
      const k=2+(t/14|0);
      for(let i=0;i<k&&ZF.uc+i<90;i++){
        const side=Math.random()*4|0,r=1+Math.random()*(GRID-3);
        const x=side===0?1:side===1?GRID-2:r,y=side===2?1:side===3?GRID-2:r;
        spawnUnit(ZF,x,y);
      }
      sfx.groan();
    }
  }

  for(const f of F){
    if(!f.alive||f.z)continue;
    f.spT+=dt;
    const si=Math.max(.5,1.5-f.crowns*.2-Math.min(.4,f.terr/1500))*f.spM;
    if(f.spT>=si){f.spT=0;
      const cap=10+f.crowns*3+(F.length<=2?14:0);
      if(f.uc<cap&&units.length<MAXU)spawnUnit(f,f.cx+(Math.random()-.5)*2.5,f.cy+(Math.random()-.5)*2.5)}
    f.exT+=dt;
    if(f.exT>=Math.max(.1,.32-f.crowns*.04)){f.exT=0;expand(f)}
    f.tgT-=dt;if(f.tgT<=0){f.tgT=2+Math.random();aiPick(f)}
    if(t-f.lastHit>4)f.hp=Math.min(f.maxHp,f.hp+6*dt);
  }

  updateUnits(dt);
  clashes();

  for(let i=bars.length-1;i>=0;i--){
    const b=bars[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    const f=F[b.f-1];
    if(!f.alive||b.life<=0||!inB(Math.round(b.x),Math.round(b.y))){bars.splice(i,1);continue}
    const px=-Math.sin(b.ang),py=Math.cos(b.ang);let wallHit=false;
    for(let s=-2;s<=2;s++){const x=Math.round(b.x+px*s),y=Math.round(b.y+py*s);
      if(inB(x,y)){if(grid[y*GRID+x]===WALL)wallHit=true;else setCell(x,y,f.id)}}
    for(const e of F)if(e.alive&&!e.z&&e.id!==f.id&&!b.hit[e.id]&&isFoe(f.id,e.id)&&Math.hypot(b.x-e.cx,b.y-e.cy)<3.5){
      b.hit[e.id]=1;e.hp-=22;e.lastHit=t;wave(e.cx,e.cy,4,f.color,.8);
      if(e.hp<=0)conquer(e,f);
    }
    for(const u of units)if(isFoe(u.f,b.f)&&Math.abs(u.x-b.x)<2.5&&Math.abs(u.y-b.y)<2.5)u.hp-=40*dt;
    if(wallHit)b.life=0;
  }
  for(let i=shots.length-1;i>=0;i--){shots[i].life-=dt;if(shots[i].life<=0)shots.splice(i,1)}
  for(let i=waves.length-1;i>=0;i--){const w=waves[i];w.r+=dt*18;w.a-=dt*1.4;if(w.a<=0||w.r>=w.max)waves.splice(i,1)}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)parts.splice(i,1)}

  // پایان بازی
  if(!ended){
    const live=F.filter(f=>f.alive&&!f.z);
    if(mode==='zombie'){
      if(!F[me-1].alive){ended=true;finish(false,false)}
      else if(t>=ZT){ended=true;finish(true,false)}
    }else{
      if(playing&&!meDeadShown&&!F[me-1].alive&&live.length>1){meDeadShown=true;endMatch(false,true)}

  }
}
function finish(win,defeatOnly){
  if(playing)endMatch(win,defeatOnly);
  else setTimeout(()=>{if(!playing)initBattle(mode)},2500);
}
function updateUnits(dt){
  for(let i=units.length-1;i>=0;i--){
    const u=units[i],f=F[u.f-1];
    if(!f.alive||u.hp<=0){
      if(u.hp<=0&&f.alive){burst(u.x,u.y,f.z?'#84cc16':f.color,5);if(Math.random()<.3)wave(u.x,u.y,2.5,'#ffffff',.5)}
      units.splice(i,1);continue
    }
    const fz=u.frz>0;
    u.ang+=u.spin*(1+(f.sword-1)*.25)*dt*(fz?.2:1);
    if(u.fl>0)u.fl-=dt;
    u.rt-=dt;
    if(u.rt<=0&&!u.guard){
      u.rt=.5+Math.random()*.6;
      if(f.z){
        let best=null,bd=1e9;
        for(const e of F)if(e.alive&&!e.z){const d=Math.hypot(e.cx-u.x,e.cy-u.y);if(d<bd){bd=d;best=e}}
        if(best&&Math.random()<.88){u.tx=best.cx+(Math.random()-.5)*3;u.ty=best.cy+(Math.random()-.5)*3}
        else{u.tx=Math.max(2,Math.min(GRID-3,u.x+(Math.random()-.5)*18));u.ty=Math.max(2,Math.min(GRID-3,u.y+(Math.random()-.5)*18))}
      }
      else if(f.rx!==null&&Math.random()<.85){u.tx=f.rx+(Math.random()-.5)*4;u.ty=f.ry+(Math.random()-.5)*4}
      else if(f.target&&Math.random()<.7){u.tx=f.target.x+(Math.random()-.5)*4;u.ty=f.target.y+(Math.random()-.5)*4}
      else{u.tx=Math.max(2,Math.min(GRID-3,u.x+(Math.random()-.5)*18));u.ty=Math.max(2,Math.min(GRID-3,u.y+(Math.random()-.5)*18))}
    }
    const dx=u.tx-u.x,dy=u.ty-u.y,d=Math.hypot(dx,dy)||1;
    let sp=(f.z?5.4:7.2+Math.min(3.5,f.crowns*.55))*f.spdM;
    if(fz){sp*=.2;u.frz-=dt}else if(f.rage>0)sp*=1.5;
    u.vx+=(dx/d*sp-u.vx)*5*dt;u.vy+=(dy/d*sp-u.vy)*5*dt;
    if(u.guard){u.tx=u.gx;u.ty=u.gy;if(Math.hypot(u.gx-u.x,u.gy-u.y)<.45){u.vx=u.vy=0;u.x=u.gx;u.y=u.gy;u.arr=1}}
    if(Math.abs(u.vx)>.5)u.face=u.vx>0?1:-1;
    u.walk+=dt*(7+Math.hypot(u.vx,u.vy));if(u.guard&&u.arr)u.walk=0;
    const nx=Math.max(1,Math.min(GRID-2,u.x+u.vx*dt)),ny=Math.max(1,Math.min(GRID-2,u.y+u.vy*dt));
    if(grid[Math.round(u.y)*GRID+Math.round(nx)]!==WALL)u.x=nx;else u.vx=-u.vx*.8;
    if(grid[Math.round(ny)*GRID+Math.round(u.x)]!==WALL)u.y=ny;else u.vy=-u.vy*.8;
    paint(u.x,u.y,f.sword>=3?2:1,f.id);
    if(!f.z){
      const sl=3.2+Math.min(3.4,(f.sword-1)*.8);
      setCell(Math.round(u.x+Math.cos(u.ang)*sl),Math.round(u.y+Math.sin(u.ang)*sl),f.id);
    }
    for(const e of F){
      if(!e.alive||e.z||!isFoe(f.id,e.id))continue;
      const cd2=Math.hypot(e.cx-u.x,e.cy-u.y);
      if(cd2<4.2)u.hp-=4*dt;
      if(cd2<2.8){
        e.hp-=(6+f.sword*3)*f.dmgM*(f.rage>0?1.35:1)*dt*(1+t/150);e.lastHit=t;
        u.vx=(u.x-e.cx)*3;u.vy=(u.y-e.cy)*3;sfx.thud();

      }
    }
  }
}
function clashes(){
  for(const b of buckets)b.length=0;
  for(const u of units){const bx=Math.min(BK-1,Math.max(0,u.x/4|0)),by=Math.min(BK-1,Math.max(0,u.y/4|0));buckets[by*BK+bx].push(u)}
  for(let by=0;by<BK;by++)for(let bx=0;bx<BK;bx++){
    const a=buckets[by*BK+bx];if(!a.length)continue;
    for(let i=0;i<a.length;i++){
      for(let j=i+1;j<a.length;j++)hit(a[i],a[j]);
      for(const n of NB){const nx=bx+n[0],ny=by+n[1];if(nx<0||ny<0||nx>=BK||ny>=BK)continue;
        const b=buckets[ny*BK+nx];for(let k=0;k<b.length;k++)hit(a[i],b[k])}
    }
  }
}

/* ================= نقاشی اجزا ================= */
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function drawSword(c,type,ang,len,tm){
  c.save();c.rotate(ang);

function updateTexture(){
  for(let gy=0;gy<GRID;gy++)for(let gx=0;gx<GRID;gx++){
    const c=grid[gy*GRID+gx],bx=gx*CELL,by=gy*CELL;
    if(c===0){
      const col=((gx+gy)&1)?G1:G2,h=((gx*73856093)^(gy*19349663))>>>0;
      for(let py=0;py<CELL;py++){const r=(by+py)*TEX+bx;for(let px=0;px<CELL;px++)buf[r+px]=col}
      if(h%9===0){buf[(by+1+(h>>4)%2)*TEX+bx+1+(h>>6)%2]=DEC}
      if(h%23===0){const r=(by+2)*TEX+bx;buf[r]=DEC2;buf[r+1]=DEC2}
    }else if(c===WALL){
      for(let py=0;py<CELL;py++){const r=(by+py)*TEX+bx;for(let px=0;px<CELL;px++)
        buf[r+px]=(py===0||px===0)?WL:(py===CELL-1||px===CELL-1)?WD:WF}
    }else{

function freeSpot(x,y){

  const dt=Math.min(.05,(now-last)/1000);last=now;

    acc+=dt*(playing?speed:1.5);let n=0;

(function(){

/* ===== انیمیشن کانواسی صفحه‌ی ورود ===== */
(function(){
 const it=document.getElementById('intro'),cv=document.getElementById('icv');if(!it||!cv)return;
 const g=cv.getContext('2d');let W=innerWidth,HH=innerHeight;const dp=Math.min(2,window.devicePixelRatio||1);
 const rs=()=>{W=innerWidth;HH=innerHeight;cv.width=W*dp;cv.height=HH*dp};rs();addEventListener('resize',rs);
 const R=(a,b)=>a+Math.random()*(b-a),TAU2=Math.PI*2;
 const mo=Array.from({length:80},()=>({x:Math.random(),y:Math.random(),r:R(.7,2.5),s:R(.006,.03),p:R(0,6.3),c:Math.random()<.28?'255,205,100':'130,175,255'}));
 let sp=[],rg=[],ss=[],em=[],ds=[],tw=[],tk=[];let fl=0,imp=-1,fxT=0;
 let sB=null,sR=null,arm=null;
 try{sB=[hSpr('#3b82f6',0,'basic','basic',1),hSpr('#3b82f6',1,'basic','basic',1)];sR=[hFl(hSpr('#ef2b3d',0,'basic','basic',1)),hFl(hSpr('#ef2b3d',1,'basic','basic',1))]}catch(e){sB=null}
 const mkArm=()=>{const a=[],h=Math.max(40,Math.min(66,W*.125)),gy=HH*.78,v=Math.max(280,W*.62);
  for(let s=0;s<2;s++)for(let i=0;i<9;i++){const dir=s?-1:1,row=i%3,col=(i/3)|0;
   a.push({s,dir,h,v,row,col,y:gy+(row-1)*h*.3+R(-3,3),x:s?W+70+i*h*.5:-70-i*h*.5,stop:W/2-dir*(h*.3+col*h*.5),ts:3+i*.05,arr:false,ph:R(0,6),dt:0})}
  return a};
 let cr=null,hd=null,rc=0;
 const star=(x,y,r,al,rot)=>{g.save();g.translate(x,y);g.rotate(rot||0);g.globalAlpha=al;g.beginPath();for(let i=0;i<8;i++){const rr=i%2?r*.22:r,a=i/8*TAU2;g.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}g.closePath();g.fill();g.restore()};
 const burst=(x,y,n,v0,v1,cols,gr,l0,l1,sz)=>{for(let i=0;i<n&&sp.length<520;i++){const a=R(0,TAU2),v=R(v0,v1);sp.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:gr,l:R(l0,l1),m:0,c:cols[(Math.random()*cols.length)|0],z:R(sz*.6,sz*1.4)});sp[sp.length-1].m=sp[sp.length-1].l}};
 const t0=performance.now();let last=t0,nS=.4,nE=0,nT=0,doneImp=false;
 function frame(now){
  if(!it.isConnected)return;requestAnimationFrame(frame);
  const t=(now-t0)/1000,dt=Math.min(.05,(now-last)/1000);last=now;
  g.setTransform(dp,0,0,dp,0,0);g.clearRect(0,0,W,HH);
  if((rc-=dt)<=0){rc=.25;const q=document.getElementById('crw'),w=document.getElementById('w2');if(q)cr=q.getBoundingClientRect();if(w)hd=w.getBoundingClientRect()}
  g.globalCompositeOperation='lighter';
  for(const m of mo){m.y-=m.s*dt;m.x+=Math.sin(t*.6+m.p)*.01*dt*10;if(m.y<-.02){m.y=1.02;m.x=Math.random()}const al=(.25+.5*Math.sin(t*1.7+m.p)**2)*Math.min(1,t/.8);g.fillStyle=`rgba(${m.c},${al})`;g.beginPath();g.arc(m.x*W,m.y*HH,m.r,0,TAU2);g.fill()}
  if(t>.4&&t<2.6&&(nS-=dt)<=0){nS=R(.35,.7);const x=R(W*.3,W*1.05);ss.push({x,y:R(-20,HH*.35),vx:-R(500,800),vy:R(250,420),l:R(.6,1)});ss[ss.length-1].m=ss[ss.length-1].l}
  for(let i=ss.length-1;i>=0;i--){const q=ss[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.l-=dt;if(q.l<=0){ss.splice(i,1);continue}const k=q.l/q.m,gr=g.createLinearGradient(q.x,q.y,q.x-q.vx*.14,q.y-q.vy*.14);gr.addColorStop(0,`rgba(255,255,255,${k})`);gr.addColorStop(1,'rgba(120,170,255,0)');g.strokeStyle=gr;g.lineWidth=2.2;g.beginPath();g.moveTo(q.x,q.y);g.lineTo(q.x-q.vx*.14,q.y-q.vy*.14);g.stroke()}
  // crown rays
  if(cr&&t>3.05){const k=Math.min(1,(t-3.05)/.8),cx=cr.left+cr.width/2,cy=cr.top+cr.height/2;g.save();g.translate(cx,cy);g.rotate(t*.5);for(let i=0;i<14;i++){g.rotate(TAU2/14);const gr=g.createLinearGradient(0,0,0,-cr.width*1.7);gr.addColorStop(0,`rgba(255,220,120,${.32*k})`);gr.addColorStop(1,'rgba(255,220,120,0)');g.fillStyle=gr;g.beginPath();g.moveTo(-2,0);g.lineTo(2,0);g.lineTo(6,-cr.width*1.7);g.lineTo(-6,-cr.width*1.7);g.fill()}g.restore()}
  // impact
  if(!doneImp&&t>=2.65&&hd){doneImp=true;imp=t;const cx=hd.left+hd.width/2,cy=hd.bottom-14;fl=.4;
   burst(cx,cy,150,120,560,['#ffd27a','#ff8a3d','#fff','#ff4d2e'],420,.8,1.8,3.2);
   for(let i=0;i<3;i++)rg.push({x:cx,y:cy,r:8,mr:Math.max(W,HH)*(.55+i*.25),sp:2.4-i*.4,l:1,c:i?'120,170,255':'255,110,90',w:6-i*1.5,d:i*.09});
   for(let i=0;i<30;i++){const a=R(Math.PI*1.05,Math.PI*1.95);tw.push({x:cx,y:cy,a,l:R(.3,.55),m:.55,len:R(80,300)})}}
  // rings / speed lines / flare
  for(let i=rg.length-1;i>=0;i--){const q=rg[i];if(q.d>0){q.d-=dt;continue}q.r+=(q.mr-q.r)*Math.min(1,dt*q.sp*2);q.l-=dt*.9;if(q.l<=0){rg.splice(i,1);continue}g.strokeStyle=`rgba(${q.c},${q.l*.7})`;g.lineWidth=q.w*q.l+1;g.beginPath();g.ellipse(q.x,q.y,q.r,q.r*.34,0,0,TAU2);g.stroke()}
  for(let i=tw.length-1;i>=0;i--){const q=tw[i];q.l-=dt;if(q.l<=0){tw.splice(i,1);continue}const k=q.l/q.m,d0=(1-k)*q.len*1.4;g.strokeStyle=`rgba(255,200,170,${k*.7})`;g.lineWidth=2;g.beginPath();g.moveTo(q.x+Math.cos(q.a)*d0,q.y+Math.sin(q.a)*d0);g.lineTo(q.x+Math.cos(q.a)*(d0+q.len*k*.6),q.y+Math.sin(q.a)*(d0+q.len*k*.6));g.stroke()}
  if(imp>0&&t-imp<.9&&hd){const k=1-(t-imp)/.9,cx=hd.left+hd.width/2,cy=hd.bottom-14,L=W*(.4+(1-k)*.9),gr=g.createLinearGradient(cx-L,0,cx+L,0);gr.addColorStop(0,'rgba(255,150,120,0)');gr.addColorStop(.5,`rgba(255,235,220,${k})`);gr.addColorStop(1,'rgba(255,150,120,0)');g.fillStyle=gr;g.fillRect(cx-L,cy-2.5-k*2,L*2,5+k*4)}
  // embers
  if(t>2.65&&(nE-=dt)<=0){nE=.022;if(em.length<150)em.push({x:R(0,W),y:HH+10,vy:-R(70,200),p:R(0,6),l:R(3,5),m:0,z:R(1.4,3.4)}),em[em.length-1].m=em[em.length-1].l}
  for(let i=em.length-1;i>=0;i--){const q=em[i];q.y+=q.vy*dt;q.x+=Math.sin(t*2+q.p)*24*dt;q.l-=dt;if(q.l<=0){em.splice(i,1);continue}const k=q.l/q.m;g.fillStyle=`rgba(255,${120+k*90|0},60,${k*.85})`;g.beginPath();g.arc(q.x,q.y,q.z*(.5+k*.5),0,TAU2);g.fill()}
  // sparkles on crown + title
  if(t>3.1&&(nT-=dt)<=0){nT=.07;const r=Math.random()<.4&&cr?cr:hd;if(r&&tk.length<80){const l=R(.4,.8);tk.push({sx:r.left+R(-.05,1.05)*r.width,sy:r.top+R(0,1)*r.height,sl:l,sm:l,ss:R(5,13)})}}
  g.fillStyle='#fff';
  for(let i=tk.length-1;i>=0;i--){const q=tk[i];q.sl-=dt;if(q.sl<=0){tk.splice(i,1);continue}const a=Math.sin((1-q.sl/q.sm)*Math.PI);star(q.sx,q.sy,q.ss*a,a*.95,t)}
  // sparks
  for(let i=sp.length-1;i>=0;i--){const q=sp[i];q.vy+=q.g*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.99;q.l-=dt;if(q.l<=0){sp.splice(i,1);continue}const k=q.l/q.m;g.fillStyle=q.c;g.globalAlpha=Math.min(1,k*1.4);g.beginPath();g.arc(q.x,q.y,q.z*(.4+k*.6),0,TAU2);g.fill();g.globalAlpha=1}
  // flash
  if(fl>0){g.fillStyle=`rgba(255,200,180,${fl})`;g.fillRect(0,0,W,HH);fl-=dt*.7}
  g.globalCompositeOperation='source-over';
  // armies
  if(sB){if(!arm)arm=mkArm();
   for(const a of arm){if(t<a.ts)continue;
    if(!a.arr){a.x+=a.dir*a.v*dt;if((a.stop-a.x)*a.dir<=0){a.x=a.stop;a.arr=true;burst(W/2,a.y-a.h*.4,10,60,260,['#ffd27a','#fff','#ff8a3d'],300,.3,.7,2.4)}
     else if(Math.random()<dt*14)ds.push({x:a.x-a.dir*a.h*.2,y:a.y,l:.45,m:.45,r:R(3,6),vx:-a.dir*R(10,40)})}
    const fight=a.arr,run=!a.arr,fr=(((t*(fight?9:11)+a.ph)|0)&1),spr=(a.s?sR:sB)[fr],hop=run?-Math.abs(Math.sin(t*20+a.ph))*a.h*.07:0;
    let ox=0,rot=0;if(fight){ox=Math.sin(t*13+a.ph)*a.h*.11*a.dir;rot=Math.sin(t*13+a.ph)*.16*a.dir;if(Math.random()<dt*7){const mx=W/2+R(-a.h*.5,a.h*.5);burst(mx,a.y-a.h*.45,6,70,300,['#ffd27a','#fff','#ff8a3d'],360,.25,.6,2.2)}}
    g.save();g.translate(a.x+ox,a.y+hop);g.rotate(rot);g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(0,0,a.h*.26,a.h*.07,0,0,TAU2);g.fill();g.drawImage(spr,-a.h*.357,-a.h*.87,a.h*.714,a.h);g.restore()}
   for(let i=ds.length-1;i>=0;i--){const q=ds[i];q.l-=dt;if(q.l<=0){ds.splice(i,1);continue}q.x+=q.vx*dt;q.y-=14*dt;const k=q.l/q.m;g.fillStyle=`rgba(210,200,185,${k*.35})`;g.beginPath();g.arc(q.x,q.y,q.r*(2-k),0,TAU2);g.fill()}}
 }
 requestAnimationFrame(frame);
})();
